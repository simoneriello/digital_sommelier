<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Materia Liquida &mdash; Sommelier Digitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #0e1310; display: flex; justify-content: center; min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif; }
  #root { width: 100%; max-width: 430px; }

  .app-root {
    --ink: #EFE6D5; --ink-dim: #B9AD97; --bg: #1B241E; --bg-raised: #232E26;
    --accent: #B08A4E; --accent-soft: rgba(176,138,78,0.16); --wine: #7A2733; --border: rgba(239,230,213,0.12);
    background: var(--bg); color: var(--ink);
    min-height: 640px; border-radius: 18px; overflow: hidden; position: relative; box-shadow: 0 0 0 1px var(--border);
  }
  .screen { display: flex; flex-direction: column; min-height: 640px; }
  .landing { justify-content: space-between; padding: 40px 26px 28px;
    background: radial-gradient(120% 90% at 15% 0%, rgba(122,39,51,0.35), transparent 55%), var(--bg); }
  .landing-eyebrow { font-size: 12.5px; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 10px; }
  .landing-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 42px; line-height: 1.05; margin: 0 0 18px; }
  .landing-copy { font-size: 14.5px; line-height: 1.55; color: var(--ink-dim); max-width: 30ch; margin: 0; }
  .landing-actions { display: flex; flex-direction: column; gap: 12px; }
  .landing-card { display: flex; align-items: center; gap: 14px; background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 16px; cursor: pointer; color: var(--ink); text-align: left; width: 100%; font: inherit; }
  .landing-card-accent { background: linear-gradient(135deg, var(--wine), #5C1B24); border-color: transparent; }
  .landing-card-text { flex: 1; }
  .landing-card-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 500; }
  .landing-card-sub { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .landing-card-accent .landing-card-sub { color: rgba(239,230,213,0.7); }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
  .back-btn { background: var(--bg-raised); border: 1px solid var(--border); color: var(--ink); width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer; }
  .topbar-eyebrow { font-size: 11px; color: var(--accent); letter-spacing: 0.03em; }
  .topbar-nome { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; }
  .search-row { display: flex; align-items: center; gap: 8px; margin: 14px 20px 10px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .search-icon { color: var(--ink-dim); flex-shrink: 0; }
  .search-input { background: transparent; border: none; outline: none; color: var(--ink); font-size: 13.5px; width: 100%; font-family: 'Inter', sans-serif; }
  .search-input::placeholder { color: var(--ink-dim); }
  .chip-row { display: flex; gap: 7px; padding: 0 20px 14px; overflow-x: auto; }
  .chip { flex-shrink: 0; background: transparent; border: 1px solid var(--border); color: var(--ink-dim); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: 'Inter', sans-serif; }
  .chip-active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .wine-list { flex: 1; overflow-y: auto; padding: 0 16px 90px; display: flex; flex-direction: column; gap: 8px; }
  .empty-state { text-align: center; color: var(--ink-dim); font-size: 13.5px; padding: 40px 20px; }
  .wine-card { display: flex; align-items: center; gap: 12px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; text-align: left; color: var(--ink); font-family: 'Inter', sans-serif; width: 100%; font: inherit; }
  .wine-card-icon { color: var(--accent); font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
  .wine-card-main { flex: 1; min-width: 0; }
  .wine-card-name { font-family: 'Fraunces', serif; font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wine-card-sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wine-card-price { text-align: right; flex-shrink: 0; font-size: 12.5px; }
  .price-line { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--ink-dim); }
  .price-bottle { color: var(--ink); font-weight: 600; margin-top: 2px; }
  .fab-sommelier { position: absolute; bottom: 18px; left: 20px; right: 20px; background: var(--wine); color: var(--ink); border: none; border-radius: 12px;
    padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Inter', sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .detail-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; z-index: 10; }
  .detail-sheet { background: var(--bg-raised); width: 100%; border-radius: 20px 20px 0 0; padding: 10px 24px 28px; position: relative; max-height: 80%; overflow-y: auto; }
  .detail-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 6px auto 14px; }
  .detail-close { position: absolute; top: 14px; right: 18px; background: transparent; border: none; color: var(--ink-dim); cursor: pointer; }
  .detail-tipologia { color: var(--accent); font-size: 12px; letter-spacing: 0.02em; margin-bottom: 4px; }
  .detail-nome { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; margin: 0 0 4px; line-height: 1.2; }
  .detail-produttore { color: var(--ink-dim); font-size: 13px; margin-bottom: 18px; }
  .detail-prices { display: flex; gap: 10px; margin-bottom: 20px; }
  .detail-price-box { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--ink-dim); }
  .detail-price-box strong { font-size: 15px; color: var(--ink); font-weight: 600; }
  .detail-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .detail-label { color: var(--ink-dim); flex-shrink: 0; }
  .detail-value { text-align: right; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 5px 11px; font-size: 12px; }
</style>
</head>

no": "Vermentino", "prezzoCalice": 10.0, "prezzoBottiglia": 60.0, "formatoNote": "", "regione": "Sicilia/Sardegna (vedi denominazione)", "corpo": "dolce/da meditazione", "abbinamento": "dessert, formaggi erborinati, pasticceria secca"}, {"id": 137, "tipologia": "Dolce", "nome": "Passito di Pantelleria Ben Rye DOC", "produttore": "Donnafugata", "annata": "2021", "vitigno": "Zibibbo", "prezzoCalice": 13.0, "prezzoBottiglia": 62.0, "formatoNote": "37,5 cl", "regione": "Sicilia", "corpo": "dolce/da meditazione", "abbinamento": "dessert, formaggi erborinati, pasticceria secca"}];

var LOCALE = { nome: "Materia Liquida", sottotitolo: "Lubna Milano" };
var TIPOLOGIE = ["Tutti", "Bollicine", "Bianco", "Rosato", "Rosso", "Dolce"];
var ICONE_TIPOLOGIA = { Bollicine: "\u2726", Bianco: "\u25CB", Rosato: "\u25D0", Rosso: "\u25CF", Dolce: "\u2749" };

var state = { vista: "landing", filtro: "Tutti", query: "", selezionato: null };

function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function formatPrezzo(v) {
  if (v == null) return null;
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(".", ",");
}

function icon(name, size, strokeWidth) {
  size = size || 16; strokeWidth = strokeWidth || 2;
  var inner = "";
  if (name === "search") inner = '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>';
  if (name === "x") inner = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
  if (name === "chevron") inner = '<polyline points="9 6 15 12 9 18"/>';
  if (name === "pin") inner = '<path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>';
  if (name === "wine") inner = '<path d="M6 3c0 4 2 7 6 7s6-3 6-7"/><line x1="12" y1="10" x2="12" y2="18"/><line x1="8" y1="21" x2="16" y2="21"/>';
  if (name === "glass") inner = '<path d="M5 4h14l-1.5 15.5a1 1 0 0 1-1 .9H7.5a1 1 0 0 1-1-.9L5 4z"/><line x1="6" y1="9" x2="18" y2="9"/>';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + strokeWidth + '" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle">' + inner + '</svg>';
}

function renderLanding() {
  return (
    '<div class="screen landing">' +
      '<div class="landing-top">' +
        '<div class="landing-eyebrow">' + esc(LOCALE.sottotitolo) + '</div>' +
        '<h1 class="landing-title">' + esc(LOCALE.nome) + '</h1>' +
        '<p class="landing-copy">137 etichette in cantina. Sfoglia la carta o lasciati guidare verso il calice giusto.</p>' +
      '</div>' +
      '<div class="landing-actions">' +
        '<button class="landing-card" data-action="go-carta">' +
          icon("wine", 22, 1.6) +
          '<div class="landing-card-text"><div class="landing-card-title">Sfoglia la carta</div><div class="landing-card-sub">So gi\u00E0 cosa cercare</div></div>' +
          icon("chevron", 18, 2) +
        '</button>' +
        '<button class="landing-card landing-card-accent" data-action="go-carta">' +
          icon("glass", 22, 1.6) +
          '<div class="landing-card-text"><div class="landing-card-title">Fatti guidare</div><div class="landing-card-sub">Non so quale vino scegliere</div></div>' +
          icon("chevron", 18, 2) +
        '</button>' +
      '</div>' +
    '</div>'
  );
}

function wineMatches(v) {
  var matchTipo = state.filtro === "Tutti" || v.tipologia === state.filtro;
  var q = state.query.trim().toLowerCase();
  var matchQuery = q === "" ||
    v.nome.toLowerCase().indexOf(q) !== -1 ||
    v.produttore.toLowerCase().indexOf(q) !== -1 ||
    v.vitigno.toLowerCase().indexOf(q) !== -1;
  return matchTipo && matchQuery;
}

function renderWineCard(v) {
  var priceHtml = '';
  if (v.prezzoCalice != null) {
    priceHtml += '<div class="price-line">' + icon("glass", 12, 2) + ' ' + formatPrezzo(v.prezzoCalice) + '</div>';
  }
  if (v.prezzoBottiglia != null) {
    priceHtml += '<div class="price-line price-bottle">' + formatPrezzo(v.prezzoBottiglia) + '</div>';
  }
  return (
    '<button class="wine-card" data-action="open-wine" data-id="' + v.id + '">' +
      '<div class="wine-card-icon">' + (ICONE_TIPOLOGIA[v.tipologia] || "\u25CF") + '</div>' +
      '<div class="wine-card-main">' +
        '<div class="wine-card-name">' + esc(v.nome) + '</div>' +
        '<div class="wine-card-sub">' + esc(v.produttore) + (v.annata ? ' \u00B7 ' + esc(v.annata) : '') + '</div>' +
      '</div>' +
      '<div class="wine-card-price">' + priceHtml + '</div>' +
    '</button>'
  );
}

function renderCartaVini() {
  var filtrati = WINES.filter(wineMatches);
  var chipsHtml = TIPOLOGIE.map(function(t) {
    var active = t === state.filtro ? ' chip-active' : '';
    return '<button class="chip' + active + '" data-action="set-filtro" data-value="' + t + '">' + t + '</button>';
  }).join('');
  var listHtml = filtrati.length === 0
    ? '<div class="empty-state">Nessun vino corrisponde alla ricerca.</div>'
    : filtrati.map(renderWineCard).join('');

  return (
    '<div class="screen">' +
      '<header class="topbar">' +
        '<button class="back-btn" data-action="go-landing">&larr;</button>' +
        '<div class="topbar-title">' +
          '<div class="topbar-eyebrow">' + esc(LOCALE.sottotitolo) + '</div>' +
          '<div class="topbar-nome">La carta</div>' +
        '</div>' +
      '</header>' +
      '<div class="search-row">' +
        icon("search", 16, 2) +
        '<input class="search-input" id="search-input" placeholder="Cerca per nome, produttore, vitigno..." value="' + esc(state.query) + '" />' +
      '</div>' +
      '<div class="chip-row">' + chipsHtml + '</div>' +
      '<div class="wine-list">' + listHtml + '</div>' +
      '<button class="fab-sommelier" data-action="open-sommelier">Fatti consigliare ' + icon("chevron", 16, 2.4) + '</button>' +
      renderDetail() +
    '</div>'
  );
}

function renderDetail() {
  if (state.selezionato == null) return '';
  var v = WINES.filter(function(w) { return w.id === state.selezionato; })[0];
  if (!v) return '';

  var pricesHtml = '';
  if (v.prezzoCalice != null) {
    pricesHtml += '<div class="detail-price-box">' + icon("glass", 16, 1.8) + '<span>Calice</span><strong>&euro;' + formatPrezzo(v.prezzoCalice) + '</strong></div>';
  }
  if (v.prezzoBottiglia != null) {
    var noteTxt = v.formatoNote ? ' (' + esc(v.formatoNote) + ')' : '';
    pricesHtml += '<div class="detail-price-box">' + icon("wine", 16, 1.8) + '<span>Bottiglia' + noteTxt + '</span><strong>&euro;' + formatPrezzo(v.prezzoBottiglia) + '</strong></div>';
  }

  var tagsHtml = v.abbinamento.split(",").map(function(t) {
    return '<span class="tag">' + esc(t.trim()) + '</span>';
  }).join('');

  return (
    '<div class="detail-overlay" data-action="close-detail">' +
      '<div class="detail-sheet" data-action="noop">' +
        '<div class="detail-handle"></div>' +
        '<button class="detail-close" data-action="close-detail">' + icon("x", 20, 2) + '</button>' +
        '<div class="detail-tipologia">' + esc(v.tipologia) + '</div>' +
        '<h2 class="detail-nome">' + esc(v.nome) + '</h2>' +
        '<div class="detail-produttore">' + esc(v.produttore) + (v.annata ? ' \u00B7 ' + esc(v.annata) : '') + '</div>' +
        '<div class="detail-prices">' + pricesHtml + '</div>' +
        '<div class="detail-rows">' +
          '<div class="detail-row"><span class="detail-label">Vitigno</span><span class="detail-value">' + esc(v.vitigno) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">' + icon("pin", 13, 2) + ' Provenienza</span><span class="detail-value">' + esc(v.regione) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">Corpo</span><span class="detail-value">' + esc(v.corpo) + '</span></div>' +
        '</div>' +
        '<div class="detail-abbinamento">' +
          '<div class="detail-label" style="margin-bottom:8px">Si abbina bene con</div>' +
          '<div class="tag-list">' + tagsHtml + '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function render() {
  var root = document.getElementById("root");
  var html = '<div class="app-root">';
  html += state.vista === "landing" ? renderLanding() : renderCartaVini();
  html += '</div>';
  root.innerHTML = html;

  var searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.focus();
    var val = searchInput.value;
    searchInput.setSelectionRange(val.length, val.length);
  }
}

document.getElementById("root").addEventListener("click", function(e) {
  var target = e.target.closest("[data-action]");
  if (!target) return;
  var action = target.dataset.action;

  if (action === "noop") { /* click dentro la scheda dettaglio, non chiudere */ }
  else if (action === "go-carta") { state.vista = "carta"; render(); }
  else if (action === "go-landing") { state.vista = "landing"; render(); }
  else if (action === "open-sommelier") { alert("Il sommelier guidato arriva nella Fase 2 \uD83D\uDC47"); }
  else if (action === "set-filtro") { state.filtro = target.dataset.value; render(); }
  else if (action === "open-wine") { state.selezionato = parseInt(target.dataset.id, 10); render(); }
  else if (action === "close-detail") { state.selezionato = null; render(); }
});

document.getElementById("root").addEventListener("input", function(e) {
  if (e.target.id === "search-input") {
    state.query = e.target.value;
    render();
  }
});

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>SOMMI &mdash; il tuo sommelier digitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body {
    min-height: 100vh; display: flex; justify-content: center;
    font-family: 'Poppins', -apple-system, sans-serif;
    padding: 0;
  }
  #root { width: 100%; }

  .app-root {
    /* Palette SOMMI: bianco, nero, rosso -- brutalista/pulito */
    --ink: #171717; --ink-dim: #767676; --bg: #FFFFFF; --bg-raised: #F5F5F5;
    --accent: #6E2A32; --accent-dark: #4E1D23; --accent-soft: rgba(110,42,50,0.08);
    --wine: #E1352A; --border: rgba(0,0,0,0.1); --rule: #171717;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; width: 100%;
    position: relative;
  }
  .screen { display: flex; flex-direction: column; min-height: 100vh; }

  /* --- Responsive: da 640px in su, l'app diventa una card centrata con piu' respiro --- */
  @media (min-width: 640px) {
    body { padding: 32px 16px; }
    .app-root { max-width: 460px; min-height: 680px; border-radius: 4px; box-shadow: 0 30px 80px rgba(0,0,0,0.18), 0 0 0 1px var(--border); overflow: hidden; }
    .screen { min-height: 680px; }
  }
  /* --- Da 1000px in su: usiamo lo spazio extra per una lista vini a griglia --- */
  @media (min-width: 1000px) {
    .app-root { max-width: 900px; }
    .wine-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 32px; padding-bottom: 100px; }
    .landing-actions { flex-direction: row; }
    .landing-card { flex-direction: column; align-items: flex-start; text-align: left; padding: 26px 22px; gap: 16px; }
    .landing-card svg { width: 28px; height: 28px; }
  }

  .landing { justify-content: flex-start; padding: 0 0 28px; background: var(--bg); }
  .landing-hero { position: relative; width: 100%; height: 180px; overflow: hidden; flex-shrink: 0; }
  .landing-hero svg { width: 100%; height: 100%; display: block; }
  .landing-top { padding: 22px 26px 6px; }
  .landing-title { font-weight: 800; font-size: 34px; line-height: 1.08; margin: 0 0 6px; letter-spacing: -0.01em; }
  .landing-eyebrow { font-size: 13.5px; letter-spacing: 0; color: var(--ink-dim); margin-bottom: 16px; font-weight: 500; text-transform: none; }
  .landing-copy { font-size: 14px; line-height: 1.55; color: var(--ink-dim); max-width: 32ch; margin: 0; }
  .landing-actions { display: flex; flex-direction: column; gap: 12px; padding: 22px 26px 0; }
  .landing-card { display: flex; align-items: center; gap: 14px; background: var(--bg); border: 1.5px solid var(--rule);
    border-radius: 6px; padding: 18px 16px; cursor: pointer; color: var(--ink); text-align: left; width: 100%; font: inherit; }
  .landing-card-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .landing-card-text { flex: 1; }
  .landing-card-title { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; }
  .landing-card-sub { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .landing-card-accent .landing-card-sub { color: rgba(255,255,255,0.82); }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; border-bottom: 2px solid var(--rule); flex-shrink: 0; }
  .back-btn { background: var(--bg); border: 1.5px solid var(--rule); color: var(--ink); width: 34px; height: 34px; border-radius: 6px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .topbar-eyebrow { font-size: 11px; color: var(--ink-dim); letter-spacing: 0; text-transform: none; }
  .topbar-nome { font-size: 19px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.01em; }
  .search-row { display: flex; align-items: center; gap: 8px; margin: 14px 20px 10px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
  .search-icon { color: var(--ink-dim); flex-shrink: 0; }
  .search-input { background: transparent; border: none; outline: none; color: var(--ink); font-size: 13.5px; width: 100%; font-family: 'Poppins', sans-serif; }
  .search-input::placeholder { color: var(--ink-dim); }
  .chip-row { display: flex; gap: 7px; padding: 0 20px 14px; overflow-x: auto; flex-shrink: 0; }
  .chip { flex-shrink: 0; background: transparent; border: 1.5px solid var(--border); color: var(--ink-dim); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; cursor: pointer; font-family: 'Poppins', sans-serif; }
  .chip-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .wine-list { flex: 1; overflow-y: auto; padding: 4px 20px 90px; display: flex; flex-direction: column; }
  .empty-state { text-align: center; color: var(--ink-dim); font-size: 13.5px; padding: 40px 20px; grid-column: 1 / -1; }
  .wine-card { display: flex; align-items: center; gap: 12px; background: transparent; border: none; border-bottom: 1px solid var(--border);
    padding: 14px 0; cursor: pointer; text-align: left; color: var(--ink); font-family: 'Poppins', sans-serif; width: 100%; font: inherit; }
  .wine-card-icon { color: var(--accent); font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
  .wine-card-main { flex: 1; min-width: 0; }
  .wine-card-name { font-size: 13.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wine-card-sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wine-card-territorio { font-size: 11px; color: var(--accent); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 3px; font-weight: 600; }
  .wine-card-price { text-align: right; flex-shrink: 0; font-size: 12.5px; }
  .price-line { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--ink-dim); }
  .price-bottle { color: var(--ink); font-weight: 700; margin-top: 2px; }
  .fab-sommelier { position: absolute; bottom: 18px; left: 20px; right: 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 14px; font-size: 13.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Poppins', sans-serif; box-shadow: 0 8px 24px rgba(225,53,42,0.35); }
  .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .detail-sheet { background: var(--bg); width: 100%; max-width: 460px; border-radius: 16px 16px 0 0; padding: 10px 24px 28px; position: relative; max-height: 80vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.15); }
  .detail-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 6px auto 14px; }
  .detail-close { position: absolute; top: 14px; right: 18px; background: transparent; border: none; color: var(--ink-dim); cursor: pointer; }
  .detail-tipologia { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .detail-nome { font-size: 20px; font-weight: 800; text-transform: uppercase; margin: 0 0 4px; line-height: 1.2; }
  .detail-produttore { color: var(--ink-dim); font-size: 13px; margin-bottom: 18px; }
  .detail-prices { display: flex; gap: 10px; margin-bottom: 20px; }
  .detail-price-box { flex: 1; background: var(--bg-raised); border: none; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--ink-dim); }
  .detail-price-box strong { font-size: 15px; color: var(--ink); font-weight: 700; }
  .detail-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .detail-label { color: var(--ink-dim); flex-shrink: 0; }
  .detail-value { text-align: right; font-weight: 500; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; }

  /* --- Sommelier chat --- */
  .chat-body { flex: 1; overflow-y: auto; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .chat-bubble-bot { align-self: flex-start; max-width: 88%; background: var(--bg-raised); border: none; border-radius: 14px 14px 14px 4px; padding: 12px 15px; font-size: 14px; line-height: 1.5; }
  .chat-bubble-meta { font-size: 12px; color: var(--ink-dim); background: transparent; border: 1px dashed var(--border); padding: 8px 15px; }
  .chat-bubble-user { align-self: flex-end; max-width: 80%; background: var(--accent); color: #fff; border-radius: 14px 14px 4px 14px; padding: 10px 15px; font-size: 13.5px; font-weight: 500; }
  .chat-bubble-editable { border: none; cursor: pointer; font-family: 'Poppins', sans-serif; display: flex; align-items: center; gap: 7px; opacity: 0.92; }
  .chat-bubble-editable:hover, .chat-bubble-editable:active { opacity: 1; }
  .chat-options { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 92%; }
  .chat-option-btn { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif; }
  .chat-option-selected { background: var(--accent); color: #fff; font-weight: 700; }
  .chat-result-card { align-self: stretch; background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 14px; }
  .chat-result-tipologia { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .chat-result-name { font-size: 14.5px; font-weight: 800; text-transform: uppercase; }
  .chat-result-meta { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .chat-result-why { font-size: 12.5px; color: var(--ink); margin-top: 8px; line-height: 1.45; }
  .chat-result-price { font-size: 13px; color: var(--accent); font-weight: 700; margin-top: 8px; }
  .chat-restart-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 8px; align-self: stretch; }
  .chat-restart-btn { flex: 1 1 auto; min-width: 100px; background: var(--bg); border: 1.5px solid var(--rule); color: var(--ink); border-radius: 8px; padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif; }
  .chat-restart-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .chat-free-input { flex: 1; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--ink); font-size: 13.5px; font-family: 'Poppins', sans-serif; outline: none; }
  .chat-free-input::placeholder { color: var(--ink-dim); }
  .chat-send-btn { background: var(--accent); border: none; color: #fff; border-radius: 8px; width: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>

/* ===== Motore di abbinamento basato sul Metodo Mercadini (AIS) =====
   Ogni piatto e ogni vino vengono descritti sulle stesse dimensioni gusto-olfattive.
   Le regole: la maggior parte delle caratteristiche del cibo richiede nel vino la
   sensazione CONTRARIA (contrapposizione: grassezza -> acidita/tannino/sapidita del vino);
   dolcezza, aromaticita e struttura invece si abbinano per SOMIGLIANZA (concordanza). */
var LIV = { bassa: 1, media: 2, alta: 3 };
var LIV_CORPO = { "leggero": 1, "leggero-medio": 1.5, "medio": 2, "medio-corposo": 2.5, "corposo": 3, "dolce/da meditazione": 2 };
var LIV_TANNINO = { "assente": 0, "basso": 1, "medio": 2, "alto": 3 };
var LIV_DOLCEZZA = { "secco": 1, "abboccato": 2, "dolce": 3 };

/* Profilo di ogni piatto: grassezza, sapidita, acidita, dolcezza, aromaticita, struttura (scala 1-3) */
var PIATTO_PROFILO = {
  "Aperitivo":                      { grassezza: 1, sapidita: 1, acidita: 1, dolcezza: 1, aromaticita: 1, struttura: 1 },
  "Crudo di pesce":                 { grassezza: 1, sapidita: 2, acidita: 2, dolcezza: 1, aromaticita: 1, struttura: 1 },
  "Pesce alla griglia / crostacei": { grassezza: 2, sapidita: 2, acidita: 1, dolcezza: 1, aromaticita: 1, struttura: 2 },
  "Crudo di carne":                 { grassezza: 1, sapidita: 2, acidita: 1, dolcezza: 1, aromaticita: 1, struttura: 1 },
  "Salumi e affettati":             { grassezza: 3, sapidita: 3, acidita: 1, dolcezza: 1, aromaticita: 2, struttura: 2 },
  "Primi piatti / pizza":           { grassezza: 2, sapidita: 2, acidita: 2, dolcezza: 1, aromaticita: 1, struttura: 2 },
  "Carne bianca":                   { grassezza: 2, sapidita: 1, acidita: 1, dolcezza: 1, aromaticita: 1, struttura: 2 },
  "Carne rossa / grigliata":        { grassezza: 3, sapidita: 2, acidita: 1, dolcezza: 1, aromaticita: 2, struttura: 3 },
  "Formaggi e verdure grigliate":   { grassezza: 3, sapidita: 3, acidita: 1, dolcezza: 1, aromaticita: 2, struttura: 2 },
  "Dolce":                          { grassezza: 2, sapidita: 1, acidita: 1, dolcezza: 3, aromaticita: 2, struttura: 2 }
};

/* Quanto un vino soddisfa il profilo di un piatto: piu' basso e' meglio, 0 = abbinamento perfetto.
   Pesi diversi per ogni regola, calibrati sull'importanza relativa nel Metodo Mercadini. */
function penalitaAbbinamento(vino, piatto) {
  var acidita = LIV[vino.acidita];
  var sapidita = LIV[vino.sapidita];
  var tannino = LIV_TANNINO[vino.tannino];
  var corpo = LIV_CORPO[vino.corpo];
  var aromaticita = LIV[vino.aromaticita];
  var dolcezza = vino.tipologia === "Bollicine" ? 1 : LIV_DOLCEZZA[vino.dolcezza]; // le bollicine sono quasi sempre secche

  var p = 0;
  // contrapposizione: acidita e sapidita del vino devono reggere la grassezza del piatto
  if (acidita < piatto.grassezza) p += (piatto.grassezza - acidita) * 2;
  if (sapidita < piatto.grassezza) p += (piatto.grassezza - sapidita) * 1;
  // il tannino deve avvicinarsi a grassezza+struttura (lega con grassi e proteine, ma va tenuto basso su piatti delicati)
  var tanninoIdeale = (piatto.grassezza + piatto.struttura) / 2 - 1; // scala 0-3 circa
  p += Math.abs(tannino - tanninoIdeale) * 1.5;
  // concordanza obbligatoria: il vino deve essere dolce almeno quanto il piatto
  if (dolcezza < piatto.dolcezza) p += (piatto.dolcezza - dolcezza) * 4;
  // concordanza: aromaticita e struttura devono avvicinarsi a quelle del piatto
  p += Math.abs(aromaticita - piatto.aromaticita) * 1;
  p += Math.abs(corpo - piatto.struttura) * 2;

  return p;
}

      var n = parseInt(m[1], 10);
      if (n <= 30) somm.prezzo = "Fino a 30\u20ac";
      else if (n <= 50) somm.prezzo = "30\u201350\u20ac";
      else if (n <= 80) somm.prezzo = "50\u201380\u20ac";
      else somm.prezzo = "Oltre 80\u20ac";
    } else if (/econom|poco costos|non troppo car|budget basso/.test(testo)) {
      somm.prezzo = "Fino a 30\u20ac";
    } else if (/non ho.{0,15}budget|qualsiasi (cifra|prezzo)|non importa il prezzo|nessun limite/.test(testo)) {
      somm.prezzo = "Non ho un limite preciso";
    }
  }
}

  var inputEl = document.getElementById("chat-free-input");

function resetSommDa(field) {
  var idx = FIELD_ORDER.indexOf(field);
  for (var i = idx; i < FIELD_ORDER.length; i++) {
    var f = FIELD_ORDER[i];
    if (CAMPI_MULTI.indexOf(f) !== -1) {
      // se stiamo modificando proprio questo campo, teniamo le selezioni gia' fatte
      // (l'utente vuole aggiungere/togliere una voce, non ripartire da zero)
      if (f !== field) somm[f] = [];
      sommConfirmed[f] = false;
    } else {
      somm[f] = null;
    }
  }
  somm.risultato = null;
}

/* ================= SOMMELIER (chat guidata, cibo prima, nessun vincolo di colore) ================= */
function prezzoEffettivo(v) {
  if (v.prezzoBottiglia != null) return v.prezzoBottiglia;
  if (v.prezzoCalice != null) return v.prezzoCalice * 4;
  return null;
}

function matchCarattere(v) {
  var corpi = CARATTERE_CORPO[somm.carattere];
  if (!corpi) return true;
  return corpi.indexOf(v.corpo) !== -1;
}
function matchPrezzo(v) {
  var p = prezzoEffettivo(v);
  if (somm.prezzo === "Non ho un limite preciso") return true;
  if (p == null) return false;
  if (somm.prezzo === "Fino a 30\u20ac") return p <= 30;
  if (somm.prezzo === "30\u201350\u20ac") return p > 30 && p <= 50;
  if (somm.prezzo === "50\u201380\u20ac") return p > 50 && p <= 80;
  if (somm.prezzo === "Oltre 80\u20ac") return p > 80;
  return true;
}
function matchTipologiaPref(v) {
  var sel = somm.tipologiaPref;
  if (!sel || sel.length === 0 || sel.indexOf(TIPOLOGIA_PREF_NESSUNA) !== -1) return true;
  return sel.indexOf(v.tipologia) !== -1;
}
function matchAbbinamentoItem(v, item) {
  var piatto = PIATTO_PROFILO[item];
  if (!piatto) return false;
  return penalitaAbbinamento(v, piatto) <= SOGLIA_BUON_ABBINAMENTO;
}
/* Quanti dei piatti scelti a tavola questo vino copre: piu' e' versatile, meglio e'. */
function contaCoperture(v) {
  return somm.abbinamento.reduce(function(acc, item) { return acc + (matchAbbinamentoItem(v, item) ? 1 : 0); }, 0);
}

/* Somma delle penalita' Mercadini sui piatti scelti: piu' basso e' meglio,
   usato per ordinare i vini a parita' di piatti coperti. */
function penalitaTotale(v) {
  return somm.abbinamento.reduce(function(acc, item) {
    var piatto = PIATTO_PROFILO[item];
    return acc + (piatto ? penalitaAbbinamento(v, piatto) : 0);
  }, 0);
}

function poolWith(filters) {
  return WINES.filter(function(v) {
    return (filters.indexOf("carattere") === -1 || matchCarattere(v)) &&
      (filters.indexOf("prezzo") === -1 || matchPrezzo(v)) &&
      (filters.indexOf("tipologiaPref") === -1 || matchTipologiaPref(v));
  });
}

function mescola(array) {
  var a = array.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* Se il cliente ha chiesto esplicitamente piu' tipologie (es. Rosso + Bollicine), garantisce
   un rappresentante per ciascuna, anche pescando da un pool piu' ampio (che rispetta ancora
   budget e tipologia, ma non il vincolo stretto di abbinamento al piatto) quando serve:
   la preferenza esplicita del cliente vince sull'abbinamento "tecnicamente perfetto". */
function scegliUnoPerTipologia(tipologieRichieste, candidatiStretti, poolAmpio) {
  var scelti = [];
  var ordinePerQualita = tipologieRichieste.map(function(t) {
    var opzioni = candidatiStretti.filter(function(v) { return v.tipologia === t; });
    if (opzioni.length === 0) opzioni = poolAmpio.filter(function(v) { return v.tipologia === t; });
    opzioni.sort(function(a, b) { return penalitaTotale(a) - penalitaTotale(b); });
    return { tipologia: t, migliore: opzioni.length > 0 ? opzioni[0] : null };
  }).filter(function(x) { return x.migliore !== null; });

  ordinePerQualita.forEach(function(entry) {
    if (scelti.length < 3 && scelti.indexOf(entry.migliore) === -1) scelti.push(entry.migliore);
  });

  if (scelti.length < 3) {
    var restanti = candidatiStretti.slice().sort(function(a, b) { return penalitaTotale(a) - penalitaTotale(b); });
    for (var i = 0; i < restanti.length && scelti.length < 3; i++) {
      if (scelti.indexOf(restanti[i]) === -1) scelti.push(restanti[i]);
    }
  }
  return scelti;
}

/* Sceglie 3 vini tra le BUONE opzioni disponibili (non solo le 3 "matematicamente migliori"):
   ordina per copertura piatti e punteggio Mercadini, prende un ventaglio piu' ampio di
   candidati validi (non solo i primi 3), lo mescola, e sceglie privilegiando la varieta'
   di tipologia. Cosi' con gli stessi criteri si vedono alternative reali diverse ogni volta,
   non sempre la stessa terna, pur restando dentro le opzioni realmente valide. */
function scegliTre(candidati, poolAmpio) {
  poolAmpio = poolAmpio || candidati;

  var tipologieRichieste = (somm.tipologiaPref && somm.tipologiaPref.indexOf(TIPOLOGIA_PREF_NESSUNA) === -1)
    ? somm.tipologiaPref : [];
  if (tipologieRichieste.length >= 2) {
    return scegliUnoPerTipologia(tipologieRichieste, candidati, poolAmpio);
  }

  var ordinati = candidati.slice().sort(function(a, b) {
    var d = contaCoperture(b) - contaCoperture(a);
    if (d !== 0) return d;
    var p = penalitaTotale(a) - penalitaTotale(b);
    if (p !== 0) return p;
    return (prezzoEffettivo(a) || 0) - (prezzoEffettivo(b) || 0);
  });
  if (ordinati.length <= 3) return ordinati;

  // il "pool buono": la copertura migliore, e un punteggio abbastanza vicino al top
  var coperturaTop = contaCoperture(ordinati[0]);
  var penalitaTop = penalitaTotale(ordinati[0]);
  var poolBuono = ordinati.filter(function(v) {
    return contaCoperture(v) === coperturaTop && penalitaTotale(v) <= penalitaTop + 3;
  });
  if (poolBuono.length < 6) {
    // se il pool stretto e' troppo piccolo, allarghiamo prendendo comunque i migliori disponibili
    poolBuono = ordinati.slice(0, Math.min(ordinati.length, 12));
  }

  var mescolato = mescola(poolBuono);
  var scelti = [];
  var tipologieUsate = {};
  for (var i = 0; i < mescolato.length && scelti.length < 3; i++) {
    var v = mescolato[i];
    if (!tipologieUsate[v.tipologia]) {
      scelti.push(v);
      tipologieUsate[v.tipologia] = true;
    }
  }
  if (scelti.length < 3) {
    for (var j = 0; j < mescolato.length && scelti.length < 3; j++) {
      if (scelti.indexOf(mescolato[j]) === -1) scelti.push(mescolato[j]);
    }
  }
  return scelti;
}


function calcolaRisultato() {
  var N = somm.abbinamento.length;
  var base = poolWith(["carattere", "prezzo", "tipologiaPref"]);
  // pool di riserva: rispetta budget e tipologia richiesta, ma non lo stile ne' l'abbinamento
  // stretto al piatto - serve solo a garantire un rappresentante per tipologie poco affini al piatto
  var poolAmpio = poolWith(["prezzo", "tipologiaPref"]);

  for (var soglia = N; soglia >= 1; soglia--) {
    var candidati = base.filter(function(v) { return contaCoperture(v) >= soglia; });
    if (candidati.length >= 3) {
      var livello = soglia === N ? "esatto" : (soglia === 1 ? "almeno-uno" : "parziale");
      return { vini: scegliTre(candidati, poolAmpio), livello: livello, totale: candidati.length };
    }
  }

  var noCarattere = poolWith(["prezzo", "tipologiaPref"]).filter(function(v) { return contaCoperture(v) >= 1; });
  if (noCarattere.length >= 3) return { vini: scegliTre(noCarattere, poolAmpio), livello: "carattere", totale: noCarattere.length };

  var noPrezzo = poolWith(["carattere", "tipologiaPref"]).filter(function(v) { return contaCoperture(v) >= 1; });
  if (noPrezzo.length >= 3) return { vini: scegliTre(noPrezzo, poolAmpio), livello: "prezzo", totale: noPrezzo.length };

  if (base.length >= 3) return { vini: scegliTre(base, poolAmpio), livello: "abbinamento", totale: base.length };

  return { vini: scegliTre(WINES, WINES), livello: "tutto", totale: WINES.length };
}

/* Come chiamare i piatti quando si parla in modo naturale col cliente (non nei bottoni, li' vanno bene le etichette brevi) */
var PIATTO_NATURALE = {
  "Aperitivo": "un aperitivo",
  "Crudo di pesce": "un crudo di pesce",
  "Pesce alla griglia / crostacei": "pesce alla griglia o crostacei",
  "Crudo di carne": "una tartare o un carpaccio di carne",
  "Salumi e affettati": "salumi e affettati",
  "Primi piatti / pizza": "un primo o una pizza",
  "Carne bianca": "carne bianca",
  "Carne rossa / grigliata": "una grigliata di carne rossa",
  "Formaggi e verdure grigliate": "formaggi o verdure grigliate",
  "Dolce": "il dolce"
};

/* Sinonimi per descrivere il carattere del vino in linguaggio comune, mai i termini tecnici
   (acidita, tannino, corpo non compaiono mai nel testo mostrato al cliente). La scelta del
   sinonimo dipende dall'id del vino, cosi' due vini con lo stesso identikit tecnico non
   escono mai con la frase identica: non deve sembrare un testo incollato. */
var SINONIMI_CARATTERE = {
  fresco: ["fresco e vivace", "diretto e dissetante", "brioso in bocca", "con una bella spinta acida"],
  morbido: ["morbido e rotondo", "avvolgente e setoso", "vellutato al palato"],
  strutturato: ["pieno e deciso", "corposo e importante", "con una trama fitta e avvolgente", "robusto e generoso"],
  leggero: ["leggero e beverino", "snello e facile da bere", "delicato e agile"],
  sapido: ["con una piacevole nota sapida", "con un tocco quasi salino", "diretto e minerale"],
  aromatico: ["profumato e intenso", "dal naso fiorito e invitante", "ricco di aromi"]
};

function scegliSinonimo(lista, seed) {
  return lista[Math.abs(seed) % lista.length];
}

function vitignoPrincipale(v) {
  return v.vitigno.split(",")[0].trim();
}
function minuscolo(s) {
  return s.charAt(0).toLowerCase() + s.slice(1);
}

function fraseOrigine(v, seed) {
  var luogo = v.zona || v.regione;
  if (v.categoria_vitigno === "autoctono") {
    var varianti = ["vitigno tipico di " + luogo, "una tradizione vitivinicola di " + luogo];
    return scegliSinonimo(varianti, seed);
  }
  if (v.categoria_vitigno === "internazionale") {
    return "coltivato a " + luogo;
  }
  return "un uvaggio coltivato a " + luogo;
}

/* Perche' una bollicina puo' reggere un piatto impegnativo: lo spieghiamo con l'uva,
   non con un termine tecnico - e' proprio il tipo di dettaglio che chiedeva il cliente. */
function fraseExtraBollicina(v) {
  if (v.tipologia !== "Bollicine") return "";
  var v1 = v.vitigno.toLowerCase();
  var contieneUvaNera = /pinot nero|pinot noir|meunier/.test(v1);
  if (!contieneUvaNera) return "";
  if (v.tannino === "medio") {
    return "Fatta con uva nera (" + vitignoPrincipale(v) + ") e con pi\u00F9 struttura del solito per una bollicina, regge bene anche un piatto di carne.";
  }
  return "";
}

function motivazione(v) {
  var coperti = somm.abbinamento.filter(function(item) { return matchAbbinamentoItem(v, item); });
  var seed = v.id * 7 + v.nome.length * 3 + v.produttore.length;

  var acidita = LIV[v.acidita], sapidita = LIV[v.sapidita], aromaticita = LIV[v.aromaticita];
  var tannino = LIV_TANNINO[v.tannino], corpo = LIV_CORPO[v.corpo];

  var tratti = [];
  if (v.tipologia === "Dolce" || v.dolcezza === "dolce") {
    tratti.push("dolce e avvolgente, perfetto a fine pasto");
  } else if (tannino >= 2) {
    tratti.push(scegliSinonimo(SINONIMI_CARATTERE.strutturato, seed));
  } else if (corpo <= 1.5) {
    tratti.push(scegliSinonimo(SINONIMI_CARATTERE.leggero, seed));
  } else if (acidita >= 3) {
    tratti.push(scegliSinonimo(SINONIMI_CARATTERE.fresco, seed));
  } else {
    tratti.push(scegliSinonimo(SINONIMI_CARATTERE.morbido, seed + 3));
  }
  if (sapidita >= 3) tratti.push(scegliSinonimo(SINONIMI_CARATTERE.sapido, seed + 1));
  if (aromaticita >= 3) tratti.push(scegliSinonimo(SINONIMI_CARATTERE.aromatico, seed + 2));
  var tratto = tratti.join(", ");

  var vitigno = vitignoPrincipale(v);
  var origine = fraseOrigine(v, seed);
  var piattoTxt = coperti.length > 0
    ? coperti.map(function(c) { return PIATTO_NATURALE[c] || c.toLowerCase(); }).join(coperti.length > 1 ? " e " : "")
    : "";

  var forma = Math.abs(seed) % 3;
  var frase;
  if (forma === 0) {
    frase = tratto.charAt(0).toUpperCase() + tratto.slice(1) + ": " + vitigno + ", " + origine + ".";
  } else if (forma === 1) {
    frase = vitigno + ", " + origine + ", dal carattere " + tratto + ".";
  } else {
    frase = "Un calice " + tratto + ", da " + vitigno.toLowerCase() + " " + origine + ".";
  }

  if (piattoTxt) {
    var chiusure = ["Si sposa bene con " + piattoTxt + ".", "Ottima scelta con " + piattoTxt + ".", "Va d'accordo con " + piattoTxt + "."];
    frase += " " + scegliSinonimo(chiusure, seed + 5);
  }

  var extra = fraseExtraBollicina(v);
  if (extra) frase += " " + extra;

  return frase;
}

function messaggioRisultato(livello) {
  var N = somm.abbinamento.length;
  var elenco = somm.abbinamento.join(", ");
  if (livello === "esatto") {
    return N > 1
      ? "Con piatti diversi al tavolo, queste bottiglie funzionano bene con tutto quello che avete ordinato:"
      : "In base alle tue indicazioni, questi sono i suggerimenti migliori per te:";
  }
  if (livello === "parziale") return "Non ho trovato una bottiglia che vada bene con tutti i piatti scelti, ma queste coprono la maggior parte del tavolo:";
  if (livello === "almeno-uno") return "Con piatti cos\u00EC diversi \u00E8 difficile trovare un'unica bottiglia buona per tutti \u2014 queste coprono almeno uno dei piatti scelti. Se il tavolo \u00E8 molto vario, vale la pena ordinare pi\u00F9 bottiglie diverse invece di una sola:";
  if (livello === "carattere") return "Ho ampliato leggermente sullo stile del vino per darti pi\u00F9 scelta \u2014 budget e abbinamento restano rispettati:";
  if (livello === "prezzo") return "Per restare fedele allo stile e all'abbinamento scelti, ti propongo opzioni leggermente oltre il budget indicato:";
  if (livello === "abbinamento") return "Con il budget indicato non ci sono vini pensati apposta per \u201C" + esc(elenco) + "\u201D \u2014 ecco le opzioni pi\u00F9 vicine per stile e prezzo, che restano comunque valide:";
  return "Ecco una selezione dalla nostra carta, anche se non rispecchia in pieno tutti i criteri indicati:";
}

function renderRispostaBubble(field, valore) {
  var testo = Array.isArray(valore) ? valore.join(", ") : valore;
  return '<button class="chat-bubble-user chat-bubble-editable" data-action="somm-edit" data-field="' + field + '">' +
    esc(testo) + ' ' + icon("edit", 12, 2.2) +
  '</button>';
}

function renderSommelier() {
  var bubbles = ['<div class="chat-bubble-bot">Ciao! Ti aiuto a trovare il vino giusto. Scegli dai bottoni o scrivimi liberamente qui sotto \u2014 puoi anche cambiare idea in qualsiasi momento.</div>'];

  sommChatLibero.forEach(function(msg) {
    bubbles.push('<div class="chat-bubble-user">' + esc(msg) + '</div>');
  });

  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i];

    bubbles.push('<div class="chat-bubble-bot">' + esc(q.prompt) + '</div>');

    var risposta = somm[q.key];
    var risposta_data = q.multi ? (risposta.length > 0 && sommConfirmed[q.key]) : !!risposta;

    if (risposta_data) {
      bubbles.push(renderRispostaBubble(q.key, risposta));
    } else if (q.multi) {
      var opzHtml = q.options.map(function(o) {
        var selezionato = somm[q.key].indexOf(o) !== -1;
        return '<button class="chat-option-btn' + (selezionato ? ' chat-option-selected' : '') + '" data-action="somm-toggle" data-field="' + q.key + '" data-value="' + esc(o) + '">' +
          (selezionato ? '\u2713 ' : '') + esc(o) +
        '</button>';
      }).join('');
      bubbles.push('<div class="chat-options">' + opzHtml + '</div>');
      if (somm[q.key].length > 0) {
        var parole = CONTINUA_PAROLE[q.key];
        var etichettaContinua = "Continua \u2192";
        if (parole && somm[q.key].indexOf(TIPOLOGIA_PREF_NESSUNA) === -1) {
          var n = somm[q.key].length;
          etichettaContinua = "Continua con " + n + " " + (n > 1 ? parole.plurale : parole.singolare) + " \u2192";
        }
        bubbles.push('<button class="chat-restart-btn primary" data-action="somm-confirm" data-field="' + q.key + '" style="align-self:flex-end">' + etichettaContinua + '</button>');
      }
      return finishSommelier(bubbles);
    } else {
      bubbles.push('<div class="chat-options">' + q.options.map(function(o) {
        return '<button class="chat-option-btn" data-action="somm-answer" data-field="' + q.key + '" data-value="' + esc(o) + '">' + esc(o) + '</button>';
      }).join('') + '</div>');
      return finishSommelier(bubbles);
    }
  }

  if (!somm.risultato) somm.risultato = calcolaRisultato();
  var r = somm.risultato;

  bubbles.push('<div class="chat-bubble-bot">' + messaggioRisultato(r.livello) + '</div>');

  if (r.totale > 3) {
    bubbles.push('<div class="chat-bubble-bot chat-bubble-meta">In carta ci sono ' + r.totale + ' vini adatti a questi criteri \u2014 te ne mostro 3, tocca "Altre proposte" per vederne altri.</div>');
  } else if (r.totale === 3) {
    bubbles.push('<div class="chat-bubble-bot chat-bubble-meta">Con questi criteri, questi 3 sono tutti i vini disponibili in carta.</div>');
  }

  if (somm.abbinamento.indexOf("Dolce") !== -1) {
    bubbles.push('<div class="chat-bubble-bot">Un consiglio onesto: i nostri dolci sono quasi tutti a base di gelato, ed \u00E8 il caso pi\u00F9 difficile in assoluto da abbinare \u2014 il freddo intenso attenua tannino e acidit\u00E0 di qualsiasi vino. Questi restano comunque scelte valide, ma non aspettarti un abbinamento perfetto.</div>');
  }

  r.vini.forEach(function(v) {
    var prezzoTxt = v.prezzoBottiglia != null ? ('&euro;' + formatPrezzo(v.prezzoBottiglia) + ' bottiglia') : ('&euro;' + formatPrezzo(v.prezzoCalice) + ' calice');
    bubbles.push(
      '<div class="chat-result-card" data-action="open-wine" data-id="' + v.id + '">' +
        '<div class="chat-result-tipologia">' + (ICONE_TIPOLOGIA[v.tipologia] || "\u25CF") + ' ' + esc(v.tipologia) + '</div>' +
        '<div class="chat-result-name">' + esc(v.nome) + '</div>' +
        '<div class="chat-result-meta">' + esc(v.produttore) + (v.annata ? ' \u00B7 ' + esc(v.annata) : '') + ' \u00B7 ' + esc(territorioText(v)) + '</div>' +
        '<div class="chat-result-why">' + esc(motivazione(v)) + '</div>' +
        '<div class="chat-result-price">' + prezzoTxt + '</div>' +
      '</div>'
    );
  });

  bubbles.push(
    '<div class="chat-restart-row">' +
      '<button class="chat-restart-btn" data-action="somm-altre">Altre proposte</button>' +
      '<button class="chat-restart-btn" data-action="somm-restart">Rifai le domande</button>' +
      '<button class="chat-restart-btn primary" data-action="go-carta">Vedi tutta la carta</button>' +
    '</div>'
  );

  return finishSommelier(bubbles);
}

function finishSommelier(bubbles) {
  return (
    '<div class="screen">' +
      '<header class="topbar">' +
        '<button class="back-btn" data-action="go-landing">&larr;</button>' +
        '<div class="topbar-title">' +
          '<div class="topbar-eyebrow">' + esc(LOCALE.sottotitolo) + '</div>' +
          '<div class="topbar-nome">Sommelier</div>' +
        '</div>' +
      '</header>' +
      '<div class="chat-body" id="chat-body">' + bubbles.join('') + '</div>' +
      '<div class="chat-input-row">' +
        '<input type="text" id="chat-free-input" class="chat-free-input" placeholder="Scrivi qui, es. \u2018qualcosa di fresco per un crudo di pesce\u2019..." />' +
        '<button class="chat-send-btn" data-action="chat-free-submit" aria-label="Invia">' + icon("chevron", 18, 2.4) + '</button>' +
      '</div>' +
      renderDetail() +
    '</div>'
  );
}

/* ================= RENDER + EVENTI ================= */
function render() {
  var root = document.getElementById("root");
  var html = '<div class="app-root">';
  if (state.vista === "landing") html += renderLanding();
  else if (state.vista === "sommelier") html += renderSommelier();
  else html += renderCartaVini();
  html += '</div>';
  root.innerHTML = html;

  var searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.focus();
    var val = searchInput.value;
    searchInput.setSelectionRange(val.length, val.length);
  }
  var chatBody = document.getElementById("chat-body");
  if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
}

document.getElementById("root").addEventListener("click", function(e) {
  var target = e.target.closest("[data-action]");
  if (!target) return;
  var action = target.dataset.action;

  if (action === "noop") { /* click dentro la scheda dettaglio, non chiudere */ }
  else if (action === "go-carta") { state.vista = "carta"; render(); }
  else if (action === "go-landing") { state.vista = "landing"; render(); }
  else if (action === "go-sommelier") { somm = { abbinamento: [], carattere: null, prezzo: null, tipologiaPref: [], risultato: null }; sommConfirmed = { abbinamento: false, tipologiaPref: false }; sommChatLibero = []; state.vista = "sommelier"; render(); }
  else if (action === "set-filtro") { state.filtro = target.dataset.value; render(); }
  else if (action === "open-wine") { state.selezionato = parseInt(target.dataset.id, 10); render(); }
  else if (action === "close-detail") { state.selezionato = null; render(); }
  else if (action === "somm-answer") { somm[target.dataset.field] = target.dataset.value; somm.risultato = null; render(); }
  else if (action === "somm-toggle") {
    var campo = target.dataset.field, valore = target.dataset.value;
    var arr = somm[campo];
    if (campo === "tipologiaPref" && valore === TIPOLOGIA_PREF_NESSUNA) {
      // "nessuna preferenza" e' esclusiva: annulla ogni altra tipologia gia' scelta
      arr = arr.indexOf(TIPOLOGIA_PREF_NESSUNA) !== -1 ? [] : [TIPOLOGIA_PREF_NESSUNA];
    } else {
      arr = arr.filter(function(x) { return x !== TIPOLOGIA_PREF_NESSUNA; });
      var idx = arr.indexOf(valore);
      if (idx === -1) arr.push(valore); else arr.splice(idx, 1);
    }
    somm[campo] = arr;
    somm.risultato = null;
    render();
  }
  else if (action === "somm-confirm") { sommConfirmed[target.dataset.field] = true; somm.risultato = null; render(); }
  else if (action === "somm-edit") { resetSommDa(target.dataset.field); render(); }
  else if (action === "chat-free-submit") { submitTestoLibero(); }
  else if (action === "somm-restart") { somm = { abbinamento: [], carattere: null, prezzo: null, tipologiaPref: [], risultato: null }; sommConfirmed = { abbinamento: false, tipologiaPref: false }; sommChatLibero = []; render(); }
  else if (action === "somm-altre") { somm.risultato = null; render(); }
});

document.getElementById("root").addEventListener("input", function(e) {
  if (e.target.id === "search-input") {
    state.query = e.target.value;
    render();
  }
});

document.getElementById("root").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && e.target.id === "chat-free-input") {
    e.preventDefault();
    submitTestoLibero();
  }
});

render();
</script>
</body>
</html>

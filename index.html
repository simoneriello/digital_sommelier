<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Materia Liquida &mdash; Sommelier Digitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0e1310; }
  body {
    min-height: 100vh; display: flex; justify-content: center;
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 0;
  }
  #root { width: 100%; }

  .app-root {
    --ink: #EFE6D5; --ink-dim: #B9AD97; --bg: #1B241E; --bg-raised: #232E26;
    --accent: #B08A4E; --accent-soft: rgba(176,138,78,0.16); --wine: #7A2733; --border: rgba(239,230,213,0.12);
    background: var(--bg); color: var(--ink);
    min-height: 100vh; width: 100%;
    position: relative;
  }
  .screen { display: flex; flex-direction: column; min-height: 100vh; }

  /* --- Responsive: da 640px in su, l'app diventa una card centrata con piu' respiro --- */
  @media (min-width: 640px) {
    body { padding: 32px 16px; }
    .app-root { max-width: 460px; min-height: 680px; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px var(--border); overflow: hidden; }
    .screen { min-height: 680px; }
  }
  /* --- Da 1000px in su: usiamo lo spazio extra per una lista vini a griglia --- */
  @media (min-width: 1000px) {
    .app-root { max-width: 900px; }
    .wine-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 100px; }
    .landing-actions { flex-direction: row; }
    .landing-card { flex-direction: column; align-items: flex-start; text-align: left; padding: 26px 22px; gap: 16px; }
    .landing-card svg { width: 28px; height: 28px; }
  }

  .landing { justify-content: space-between; padding: 40px 26px 28px;
    background: radial-gradient(120% 90% at 15% 0%, rgba(122,39,51,0.35), transparent 55%), var(--bg); }
  .landing-eyebrow { font-size: 12.5px; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 10px; }
  .landing-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 42px; line-height: 1.05; margin: 0 0 18px; }
  .landing-copy { font-size: 14.5px; line-height: 1.55; color: var(--ink-dim); max-width: 30ch; margin: 0; }
  .landing-actions { display: flex; flex-direction: column; gap: 12px; }
  .landing-card { display: flex; align-items: center; gap: 14px; background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 16px; cursor: pointer; color: var(--ink); text-align: left; width: 100%; font: inherit; }
  .landing-card-accent { background: linear-gradient(135deg, var(--wine), #5C1B24); border-color: transparent; }
  .landing-card-text { flex: 1; }
  .landing-card-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 500; }
  .landing-card-sub { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .landing-card-accent .landing-card-sub { color: rgba(239,230,213,0.7); }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .back-btn { background: var(--bg-raised); border: 1px solid var(--border); color: var(--ink); width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .topbar-eyebrow { font-size: 11px; color: var(--accent); letter-spacing: 0.03em; }
  .topbar-nome { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; }
  .search-row { display: flex; align-items: center; gap: 8px; margin: 14px 20px 10px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .search-icon { color: var(--ink-dim); flex-shrink: 0; }
  .search-input { background: transparent; border: none; outline: none; color: var(--ink); font-size: 13.5px; width: 100%; font-family: 'Inter', sans-serif; }
  .search-input::placeholder { color: var(--ink-dim); }
  .chip-row { display: flex; gap: 7px; padding: 0 20px 14px; overflow-x: auto; flex-shrink: 0; }
  .chip { flex-shrink: 0; background: transparent; border: 1px solid var(--border); color: var(--ink-dim); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; font-family: 'Inter', sans-serif; }
  .chip-active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .wine-list { flex: 1; overflow-y: auto; padding: 0 16px 90px; display: flex; flex-direction: column; gap: 8px; }
  .empty-state { text-align: center; color: var(--ink-dim); font-size: 13.5px; padding: 40px 20px; grid-column: 1 / -1; }
  .wine-card { display: flex; align-items: center; gap: 12px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; text-align: left; color: var(--ink); font-family: 'Inter', sans-serif; width: 100%; font: inherit; }
  .wine-card-icon { color: var(--accent); font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
  .wine-card-main { flex: 1; min-width: 0; }
  .wine-card-name { font-family: 'Fraunces', serif; font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wine-card-sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wine-card-territorio { font-size: 11px; color: var(--accent); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 3px; }
  .wine-card-price { text-align: right; flex-shrink: 0; font-size: 12.5px; }
  .price-line { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--ink-dim); }
  .price-bottle { color: var(--ink); font-weight: 600; margin-top: 2px; }
  .fab-sommelier { position: absolute; bottom: 18px; left: 20px; right: 20px; background: var(--wine); color: var(--ink); border: none; border-radius: 12px;
    padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Inter', sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .detail-sheet { background: var(--bg-raised); width: 100%; max-width: 460px; border-radius: 20px 20px 0 0; padding: 10px 24px 28px; position: relative; max-height: 80vh; overflow-y: auto; }
  .detail-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 6px auto 14px; }
  .detail-close { position: absolute; top: 14px; right: 18px; background: transparent; border: none; color: var(--ink-dim); cursor: pointer; }
  .detail-tipologia { color: var(--accent); font-size: 12px; letter-spacing: 0.02em; margin-bottom: 4px; }
  .detail-nome { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; margin: 0 0 4px; line-height: 1.2; }
  .detail-produttore { color: var(--ink-dim); font-size: 13px; margin-bottom: 18px; }
  .detail-prices { display: flex; gap: 10px; margin-bottom: 20px; }
  .detail-price-box { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--ink-dim); }
  .detail-price-box strong { font-size: 15px; color: var(--ink); font-weight: 600; }
  .detail-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .detail-label { color: var(--ink-dim); flex-shrink: 0; }
  .detail-value { text-align: right; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 5px 11px; font-size: 12px; }

  /* --- Sommelier chat --- */
  .chat-body { flex: 1; overflow-y: auto; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .chat-bubble-bot { align-self: flex-start; max-width: 88%; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; padding: 12px 15px; font-size: 14px; line-height: 1.5; }
  .chat-bubble-user { align-self: flex-end; max-width: 80%; background: var(--wine); color: var(--ink); border-radius: 14px 14px 4px 14px; padding: 10px 15px; font-size: 13.5px; }
  .chat-bubble-editable { border: none; cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 7px; opacity: 0.92; }
  .chat-bubble-editable:hover, .chat-bubble-editable:active { opacity: 1; }
  .chat-options { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 92%; }
  .chat-option-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 8px 15px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif; }
  .chat-option-selected { background: var(--accent); color: var(--bg); font-weight: 600; }
  .chat-result-card { align-self: stretch; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .chat-result-tipologia { font-size: 11px; color: var(--accent); letter-spacing: 0.02em; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .chat-result-name { font-family: 'Fraunces', serif; font-size: 15.5px; font-weight: 500; }
  .chat-result-meta { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .chat-result-why { font-size: 12.5px; color: var(--ink); margin-top: 8px; line-height: 1.45; }
  .chat-result-price { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 8px; }
  .chat-restart-row { display: flex; gap: 8px; padding: 4px 0 8px; align-self: stretch; }
  .chat-restart-btn { flex: 1; background: var(--bg-raised); border: 1px solid var(--border); color: var(--ink); border-radius: 10px; padding: 11px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif; }

function resetSommDa(field) {
  var idx = FIELD_ORDER.indexOf(field);
  for (var i = idx; i < FIELD_ORDER.length; i++) {
    var f = FIELD_ORDER[i];
    if (f === "abbinamento") {
      // se stiamo modificando proprio i piatti, teniamo le selezioni gia' fatte
      // (l'utente vuole aggiungere/togliere un piatto, non ripartire da zero)
      if (f !== field) somm.abbinamento = [];
      sommConfirmed.abbinamento = false;
    } else {
      somm[f] = null;
    }
  }
  somm.risultato = null;
}

function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function formatPrezzo(v) {
  if (v == null) return null;
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(".", ",");
}

function icon(name, size, strokeWidth) {
  size = size || 16; strokeWidth = strokeWidth || 2;
  var inner = "";
  if (name === "search") inner = '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>';
  if (name === "x") inner = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
  if (name === "chevron") inner = '<polyline points="9 6 15 12 9 18"/>';
  if (name === "pin") inner = '<path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>';
  if (name === "glass") inner = '<path d="M7 3h10l-1 7a4 4 0 0 1-8 0L7 3z"/><line x1="12" y1="14" x2="12" y2="19"/><line x1="8.5" y1="21" x2="15.5" y2="21"/>';
  if (name === "bottle") inner = '<path d="M10 2h4v3.5l1.5 3V20a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 8.5 20V8.5L10 5.5V2z"/><line x1="9.5" y1="10" x2="14.5" y2="10"/>';
  if (name === "edit") inner = '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + strokeWidth + '" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle">' + inner + '</svg>';
}

function territorioText(v) {
  if (v.zona) return v.regione + " \u00B7 " + v.zona;
  return v.regione;
}

/* ================= CARTA VINI ================= */
function wineMatches(v) {
  var matchTipo = state.filtro === "Tutti" || v.tipologia === state.filtro;
  var q = state.query.trim().toLowerCase();
  var matchQuery = q === "" ||
    v.nome.toLowerCase().indexOf(q) !== -1 ||
    v.produttore.toLowerCase().indexOf(q) !== -1 ||
    v.vitigno.toLowerCase().indexOf(q) !== -1;
  return matchTipo && matchQuery;
}

function renderWineCard(v) {
  var priceHtml = '';
  if (v.prezzoCalice != null) {
    priceHtml += '<div class="price-line">' + icon("glass", 12, 2) + ' ' + formatPrezzo(v.prezzoCalice) + '</div>';
  }
  if (v.prezzoBottiglia != null) {
    priceHtml += '<div class="price-line price-bottle">' + formatPrezzo(v.prezzoBottiglia) + '</div>';
  }
  return (
    '<button class="wine-card" data-action="open-wine" data-id="' + v.id + '">' +
      '<div class="wine-card-icon">' + (ICONE_TIPOLOGIA[v.tipologia] || "\u25CF") + '</div>' +
      '<div class="wine-card-main">' +
        '<div class="wine-card-name">' + esc(v.nome) + '</div>' +
        '<div class="wine-card-sub">' + esc(v.produttore) + (v.annata ? ' \u00B7 ' + esc(v.annata) : '') + '</div>' +
        '<div class="wine-card-territorio">' + icon("pin", 10, 2.2) + ' ' + esc(territorioText(v)) + '</div>' +
      '</div>' +
      '<div class="wine-card-price">' + priceHtml + '</div>' +
    '</button>'
  );
}

function renderCartaVini() {
  var filtrati = WINES.filter(wineMatches);
  var chipsHtml = TIPOLOGIE.map(function(t) {
    var active = t === state.filtro ? ' chip-active' : '';
    return '<button class="chip' + active + '" data-action="set-filtro" data-value="' + t + '">' + t + '</button>';
  }).join('');
  var listHtml = filtrati.length === 0
    ? '<div class="empty-state">Nessun vino corrisponde alla ricerca.</div>'
    : filtrati.map(renderWineCard).join('');

  return (
    '<div class="screen">' +
      '<header class="topbar">' +
        '<button class="back-btn" data-action="go-landing">&larr;</button>' +
        '<div class="topbar-title">' +
          '<div class="topbar-eyebrow">' + esc(LOCALE.sottotitolo) + '</div>' +
          '<div class="topbar-nome">La carta</div>' +
        '</div>' +
      '</header>' +
      '<div class="search-row">' +
        icon("search", 16, 2) +
        '<input class="search-input" id="search-input" placeholder="Cerca per nome, produttore, vitigno..." value="' + esc(state.query) + '" />' +
      '</div>' +
      '<div class="chip-row">' + chipsHtml + '</div>' +
      '<div class="wine-list">' + listHtml + '</div>' +
      '<button class="fab-sommelier" data-action="go-sommelier">Fatti consigliare ' + icon("chevron", 16, 2.4) + '</button>' +
      renderDetail() +
    '</div>'
  );
}

      '<div class="detail-sheet" data-action="noop">' +
        '<div class="detail-handle"></div>' +
        '<button class="detail-close" data-action="close-detail">' + icon("x", 20, 2) + '</button>' +
        '<div class="detail-tipologia">' + esc(v.tipologia) + '</div>' +
        '<h2 class="detail-nome">' + esc(v.nome) + '</h2>' +
        '<div class="detail-produttore">' + esc(v.produttore) + (v.annata ? ' \u00B7 ' + esc(v.annata) : '') + '</div>' +
        '<div class="detail-prices">' + pricesHtml + '</div>' +
        '<div class="detail-rows">' +
          '<div class="detail-row"><span class="detail-label">Vitigno</span><span class="detail-value">' + esc(v.vitigno) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">' + icon("pin", 13, 2) + ' Regione</span><span class="detail-value">' + esc(v.regione) + '</span></div>' +
          (v.zona ? '<div class="detail-row"><span class="detail-label">Zona</span><span class="detail-value">' + esc(v.zona) + '</span></div>' : '') +
          '<div class="detail-row"><span class="detail-label">Corpo</span><span class="detail-value">' + esc(v.corpo) + '</span></div>' +
        '</div>' +
        '<div class="detail-abbinamento">' +
          '<div class="detail-label" style="margin-bottom:8px">Si abbina bene con</div>' +
          '<div class="tag-list">' + tagsHtml + '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

/* ================= SOMMELIER (chat guidata, cibo prima, nessun vincolo di colore) ================= */
function prezzoEffettivo(v) {
  if (v.prezzoBottiglia != null) return v.prezzoBottiglia;
  if (v.prezzoCalice != null) return v.prezzoCalice * 4;
  return null;
}

function matchCarattere(v) {
  var corpi = CARATTERE_CORPO[somm.carattere];
  if (!corpi) return true;
  return corpi.indexOf(v.corpo) !== -1;
}
function matchPrezzo(v) {
  var p = prezzoEffettivo(v);
  if (somm.prezzo === "Non ho un limite preciso") return true;
  if (p == null) return false;
  if (somm.prezzo === "Fino a 30\u20ac") return p <= 30;
  if (somm.prezzo === "30\u201350\u20ac") return p > 30 && p <= 50;
  if (somm.prezzo === "50\u201380\u20ac") return p > 50 && p <= 80;
  if (somm.prezzo === "Oltre 80\u20ac") return p > 80;
  return true;
}
function matchAbbinamentoItem(v, item) {
  var speciale = ABBINAMENTO_CORPO_SPECIALE[item];
  if (speciale) return speciale.indexOf(v.corpo) !== -1;
  var kws = ABBINAMENTO_KEYWORDS[item] || [];
  var testo = v.abbinamento.toLowerCase();
  return kws.some(function(k) { return testo.indexOf(k) !== -1; });
}
/* Quanti dei piatti scelti a tavola questo vino copre: piu' e' versatile, meglio e'. */
function contaCoperture(v) {
  return somm.abbinamento.reduce(function(acc, item) { return acc + (matchAbbinamentoItem(v, item) ? 1 : 0); }, 0);
}

function poolWith(filters) {
  return WINES.filter(function(v) {
    return (filters.indexOf("carattere") === -1 || matchCarattere(v)) &&
      (filters.indexOf("prezzo") === -1 || matchPrezzo(v));
  });
}

/* Sceglie 3 vini privilegiando prima quanti piatti coprono, poi la varieta' di tipologia,
   cosi' un rosso puo' comparire accanto a un bianco se entrambi rispondono ai criteri. */
function scegliTre(candidati) {
  var ordinati = candidati.slice().sort(function(a, b) {
    var d = contaCoperture(b) - contaCoperture(a);
    if (d !== 0) return d;
    return (prezzoEffettivo(a) || 0) - (prezzoEffettivo(b) || 0);
  });
  if (ordinati.length <= 3) return ordinati;

  var scelti = [];
  var tipologieUsate = {};
  for (var i = 0; i < ordinati.length && scelti.length < 3; i++) {
    var v = ordinati[i];
    if (!tipologieUsate[v.tipologia]) {
      scelti.push(v);
      tipologieUsate[v.tipologia] = true;
    }
  }
  if (scelti.length < 3) {
    for (var j = 0; j < ordinati.length && scelti.length < 3; j++) {
      if (scelti.indexOf(ordinati[j]) === -1) scelti.push(ordinati[j]);
    }
  }
  return scelti;
}

function calcolaRisultato() {
  var N = somm.abbinamento.length;
  var base = poolWith(["carattere", "prezzo"]);

  for (var soglia = N; soglia >= 1; soglia--) {
    var candidati = base.filter(function(v) { return contaCoperture(v) >= soglia; });
    if (candidati.length >= 3) {
      var livello = soglia === N ? "esatto" : (soglia === 1 ? "almeno-uno" : "parziale");
      return { vini: scegliTre(candidati), livello: livello };
    }
  }

  var noCarattere = poolWith(["prezzo"]).filter(function(v) { return contaCoperture(v) >= 1; });
  if (noCarattere.length >= 3) return { vini: scegliTre(noCarattere), livello: "carattere" };

  var noPrezzo = poolWith(["carattere"]).filter(function(v) { return contaCoperture(v) >= 1; });
  if (noPrezzo.length >= 3) return { vini: scegliTre(noPrezzo), livello: "prezzo" };

  if (base.length >= 3) return { vini: scegliTre(base), livello: "abbinamento" };

  return { vini: scegliTre(WINES), livello: "tutto" };
}

function motivazione(v) {
  if (somm.abbinamento.length > 1) {
    var coperti = somm.abbinamento.filter(function(item) { return matchAbbinamentoItem(v, item); });
    if (coperti.length > 0) return v.corpo + ", buono con " + coperti.join(" e ") + ".";
  }
  var primoTag = v.abbinamento.split(",")[0].trim();
  return v.corpo + ", ottimo con " + primoTag + ".";
}

function messaggioRisultato(livello) {
  var N = somm.abbinamento.length;
  var elenco = somm.abbinamento.join(", ");
  if (livello === "esatto") {
    return N > 1
      ? "Con piatti diversi al tavolo, queste bottiglie funzionano bene con tutto quello che avete ordinato:"
      : "In base alle tue indicazioni, questi sono i suggerimenti migliori per te:";
  }
  if (livello === "parziale") return "Non ho trovato una bottiglia che vada bene con tutti i piatti scelti, ma queste coprono la maggior parte del tavolo:";
  if (livello === "almeno-uno") return "Con piatti cos\u00EC diversi \u00E8 difficile trovare un'unica bottiglia buona per tutti \u2014 queste coprono almeno uno dei piatti scelti. Se il tavolo \u00E8 molto vario, vale la pena ordinare pi\u00F9 bottiglie diverse invece di una sola:";
  if (livello === "carattere") return "Ho ampliato leggermente sullo stile del vino per darti pi\u00F9 scelta \u2014 budget e abbinamento restano rispettati:";
  if (livello === "prezzo") return "Per restare fedele allo stile e all'abbinamento scelti, ti propongo opzioni leggermente oltre il budget indicato:";
  if (livello === "abbinamento") return "Con il budget indicato non ci sono vini pensati apposta per \u201C" + esc(elenco) + "\u201D \u2014 ecco le opzioni pi\u00F9 vicine per stile e prezzo, che restano comunque valide:";
  return "Ecco una selezione dalla nostra carta, anche se non rispecchia in pieno tutti i criteri indicati:";
}

function renderRispostaBubble(field, valore) {
  var testo = Array.isArray(valore) ? valore.join(", ") : valore;
  return '<button class="chat-bubble-user chat-bubble-editable" data-action="somm-edit" data-field="' + field + '">' +
    esc(testo) + ' ' + icon("edit", 12, 2.2) +
  '</button>';
}

function renderSommelier() {
  var bubbles = ['<div class="chat-bubble-bot">Ciao! Ti aiuto a trovare il vino giusto in poche domande. Puoi toccare una tua risposta in qualsiasi momento per cambiarla.</div>'];

  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i];

    // "Solo un aperitivo" salta la domanda sul cibo: l'abbinamento si imposta da solo
    if (q.key === "abbinamento" && somm.occasione === "Solo un aperitivo") {
      if (somm.abbinamento.length === 0) { somm.abbinamento = ["Aperitivo"]; sommConfirmed.abbinamento = true; }
      continue;
    }

    bubbles.push('<div class="chat-bubble-bot">' + esc(q.prompt) + '</div>');

    var risposta = somm[q.key];
    var risposta_data = q.multi ? (risposta.length > 0 && sommConfirmed[q.key]) : !!risposta;

    if (risposta_data) {
      bubbles.push(renderRispostaBubble(q.key, risposta));
    } else if (q.multi) {
      var opzHtml = q.options.map(function(o) {
        var selezionato = somm[q.key].indexOf(o) !== -1;
        return '<button class="chat-option-btn' + (selezionato ? ' chat-option-selected' : '') + '" data-action="somm-toggle" data-field="' + q.key + '" data-value="' + esc(o) + '">' +
          (selezionato ? '\u2713 ' : '') + esc(o) +
        '</button>';
      }).join('');
      bubbles.push('<div class="chat-options">' + opzHtml + '</div>');
      if (somm[q.key].length > 0) {
        bubbles.push('<button class="chat-restart-btn primary" data-action="somm-confirm" data-field="' + q.key + '" style="align-self:flex-end">Continua con ' + somm[q.key].length + ' piatt' + (somm[q.key].length > 1 ? 'i' : 'o') + ' \u2192</button>');
      }
      return finishSommelier(bubbles);
    } else {
      bubbles.push('<div class="chat-options">' + q.options.map(function(o) {
        return '<button class="chat-option-btn" data-action="somm-answer" data-field="' + q.key + '" data-value="' + esc(o) + '">' + esc(o) + '</button>';
      }).join('') + '</div>');
      return finishSommelier(bubbles);
    }
  }

  if (!somm.risultato) somm.risultato = calcolaRisultato();
  var r = somm.risultato;

  bubbles.push('<div class="chat-bubble-bot">' + messaggioRisultato(r.livello) + '</div>');

  if (somm.abbinamento.indexOf("Dolce") !== -1) {
    bubbles.push('<div class="chat-bubble-bot">Un consiglio onesto: i nostri dolci sono quasi tutti a base di gelato, ed \u00E8 il caso pi\u00F9 difficile in assoluto da abbinare \u2014 il freddo intenso attenua tannino e acidit\u00E0 di qualsiasi vino. Questi restano comunque scelte valide, ma non aspettarti un abbinamento perfetto.</div>');
  }

  r.vini.forEach(function(v) {
    var prezzoTxt = v.prezzoBottiglia != null ? ('&euro;' + formatPrezzo(v.prezzoBottiglia) + ' bottiglia') : ('&euro;' + formatPrezzo(v.prezzoCalice) + ' calice');
    bubbles.push(
      '<div class="chat-result-card" data-action="open-wine" data-id="' + v.id + '">' +
        '<div class="chat-result-tipologia">' + (ICONE_TIPOLOGIA[v.tipologia] || "\u25CF") + ' ' + esc(v.tipologia) + '</div>' +
        '<div class="chat-result-name">' + esc(v.nome) + '</div>' +
        '<div class="chat-result-meta">' + esc(v.produttore) + (v.annata ? ' \u00B7 ' + esc(v.annata) : '') + ' \u00B7 ' + esc(territorioText(v)) + '</div>' +
        '<div class="chat-result-why">' + esc(motivazione(v)) + '</div>' +
        '<div class="chat-result-price">' + prezzoTxt + '</div>' +
      '</div>'
    );
  });

  bubbles.push(
    '<div class="chat-restart-row">' +
      '<button class="chat-restart-btn" data-action="somm-restart">Rifai le domande</button>' +
      '<button class="chat-restart-btn primary" data-action="go-carta">Vedi tutta la carta</button>' +
    '</div>'
  );

  return finishSommelier(bubbles);
}

function finishSommelier(bubbles) {
  return (
    '<div class="screen">' +
      '<header class="topbar">' +
        '<button class="back-btn" data-action="go-landing">&larr;</button>' +
        '<div class="topbar-title">' +
          '<div class="topbar-eyebrow">' + esc(LOCALE.sottotitolo) + '</div>' +
          '<div class="topbar-nome">Sommelier</div>' +
        '</div>' +
      '</header>' +
      '<div class="chat-body" id="chat-body">' + bubbles.join('') + '</div>' +
      renderDetail() +
    '</div>'
  );
}

/* ================= RENDER + EVENTI ================= */
function render() {
  var root = document.getElementById("root");
  var html = '<div class="app-root">';
  if (state.vista === "landing") html += renderLanding();
  else if (state.vista === "sommelier") html += renderSommelier();
  else html += renderCartaVini();
  html += '</div>';
  root.innerHTML = html;

  var searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.focus();
    var val = searchInput.value;
    searchInput.setSelectionRange(val.length, val.length);
  }
  var chatBody = document.getElementById("chat-body");
  if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
}

document.getElementById("root").addEventListener("click", function(e) {
  var target = e.target.closest("[data-action]");
  if (!target) return;
  var action = target.dataset.action;

  if (action === "noop") { /* click dentro la scheda dettaglio, non chiudere */ }
  else if (action === "go-carta") { state.vista = "carta"; render(); }
  else if (action === "go-landing") { state.vista = "landing"; render(); }
  else if (action === "go-sommelier") { somm = { occasione: null, abbinamento: [], carattere: null, prezzo: null, risultato: null }; sommConfirmed = { abbinamento: false }; state.vista = "sommelier"; render(); }
  else if (action === "set-filtro") { state.filtro = target.dataset.value; render(); }
  else if (action === "open-wine") { state.selezionato = parseInt(target.dataset.id, 10); render(); }
  else if (action === "close-detail") { state.selezionato = null; render(); }
  else if (action === "somm-answer") { somm[target.dataset.field] = target.dataset.value; somm.risultato = null; render(); }
  else if (action === "somm-toggle") {
    var campo = target.dataset.field, valore = target.dataset.value;
    var arr = somm[campo];
    var idx = arr.indexOf(valore);
    if (idx === -1) arr.push(valore); else arr.splice(idx, 1);
    somm.risultato = null;
    render();
  }
  else if (action === "somm-confirm") { sommConfirmed[target.dataset.field] = true; somm.risultato = null; render(); }
  else if (action === "somm-edit") { resetSommDa(target.dataset.field); render(); }
  else if (action === "somm-restart") { somm = { occasione: null, abbinamento: [], carattere: null, prezzo: null, risultato: null }; sommConfirmed = { abbinamento: false }; render(); }
});

document.getElementById("root").addEventListener("input", function(e) {
  if (e.target.id === "search-input") {
    state.query = e.target.value;
    render();
  }
});

render();
</script>
